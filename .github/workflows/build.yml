name: Build TunPixel Android

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Validate Gradle Wrapper
      uses: gradle/wrapper-validation-action@v1

    - name: Compute build number
      id: build
      run: |
        BUILD=$(printf "%05d" "${{ github.run_number }}")
        echo "number=$BUILD" >> "$GITHUB_OUTPUT"
        echo "tag=build-$BUILD" >> "$GITHUB_OUTPUT"

    - name: Decode signing keystore (if configured)
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tunpixel.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/tunpixel.keystore" >> "$GITHUB_ENV"
          echo "Using release keystore from secrets."
        else
          echo "No KEYSTORE_BASE64 secret found; falling back to debug signing."
        fi

    - name: Build release APK
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew assembleRelease

    - name: Rename APK
      if: github.event_name != 'pull_request'
      run: cp app/build/outputs/apk/release/app-release.apk "TunPixel-${{ steps.build.outputs.number }}.apk"

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: TunPixel-release-apk-${{ steps.build.outputs.number }}
        path: app/build/outputs/apk/release/app-release.apk

    - name: Create Release
      if: github.event_name != 'pull_request'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.build.outputs.tag }}
        name: TunPixel build ${{ steps.build.outputs.number }}
        body: |
          Automated build from commit ${{ github.sha }}.
          Build number: ${{ steps.build.outputs.number }}
        files: TunPixel-${{ steps.build.outputs.number }}.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
