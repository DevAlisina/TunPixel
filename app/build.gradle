plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tunpixel'
    compileSdk 34

    def ksPath = System.getenv("KEYSTORE_PATH")
    if (ksPath == null || ksPath.trim().isEmpty()) {
        ksPath = project.findProperty("RELEASE_KEYSTORE_PATH")
    }
    def hasKeystore = ksPath != null && !ksPath.toString().trim().isEmpty() && file(ksPath).exists()

    defaultConfig {
        applicationId "com.tunpixel"
        // Keep this below 24: AGP silently disables v1 (JAR) signing at minSdk >= 24,
        // and a v2-only APK is rejected by some OEM installers with "problem parsing the package".
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"

        vectorDrawables.useSupportLibrary = true
    }

    signingConfigs {
        debug {
            // Some OEM installers only accept JAR (v1) signatures; keep v1 on for the fallback too.
            enableV1Signing true
            enableV2Signing true
        }
        release {
            // Sign with v1 + v2 + v3 so the APK installs on every device/ROM.
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
            if (hasKeystore) {
                storeFile file(ksPath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (hasKeystore) {
                signingConfig signingConfigs.release
            } else {
                logger.lifecycle("WARNING: no release keystore found (KEYSTORE_PATH / RELEASE_KEYSTORE_PATH). " +
                        "Falling back to the CI-generated debug key: every build gets a DIFFERENT signature, " +
                        "so in-place updates will fail. Configure the KEYSTORE_BASE64 secret to fix this.")
                signingConfig signingConfigs.debug
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        // cloudflared is shipped as jniLibs/<abi>/libcloudflared.so so the OS extracts
        // it to the read-only, executable nativeLibraryDir (the W^X workaround for
        // Android 10+, which forbids exec() from the app's writable data dir).
        jniLibs {
            useLegacyPackaging true
            keepDebugSymbols += '**/libcloudflared.so'
        }
        resources.excludes += ['META-INF/*.kotlin_module']
    }
}

dependencies {
    implementation "androidx.core:core-splashscreen:1.0.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "androidx.recyclerview:recyclerview:1.3.2"

    def lifecycle_version = "2.8.0"
    implementation "androidx.lifecycle:lifecycle-runtime:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-service:$lifecycle_version"
}
